name: Release

# Push a version tag to publish a release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build DMG
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/SmarterThings-*.dmg build/SmarterThings-*.dmg.sha256 \
            --title "SmarterThings ${GITHUB_REF_NAME#v}" \
            --generate-notes
